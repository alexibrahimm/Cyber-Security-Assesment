    const letters = ["a", "b", "c", "d"];
    const quizForm = document.getElementById("quizForm");
    const answeredCount = document.getElementById("answeredCount");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const resultPanel = document.getElementById("resultPanel");

    function renderQuiz() {
      quizForm.innerHTML = questions.map((item, index) => `
        <article class="question-card" id="question-${index}">
          <div class="question-head">
            <span class="question-number">Question ${index + 1}</span>
            <span class="status-dot" aria-label="Not answered"></span>
          </div>
          <h2>${item.q}</h2>
          <div class="options">
            ${item.o.map((option, optionIndex) => `
              <label class="option">
                <input type="radio" name="q${index}" value="${optionIndex}">
                <span class="option-letter">${letters[optionIndex]}</span>
                <span>${option}</span>
              </label>
            `).join("")}
          </div>
        </article>
      `).join("");
    }

    function getAnswers() {
      return questions.map((_, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        return selected ? Number(selected.value) : null;
      });
    }

    function updateProgress() {
      const answers = getAnswers();
      const answered = answers.filter(answer => answer !== null).length;
      const percent = Math.round((answered / questions.length) * 100);
      answeredCount.textContent = answered;
      progressText.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;

      questions.forEach((_, index) => {
        const card = document.getElementById(`question-${index}`);
        const dot = card.querySelector(".status-dot");
        const isAnswered = answers[index] !== null;
        card.classList.toggle("answered", isAnswered);
        dot.setAttribute("aria-label", isAnswered ? "Answered" : "Not answered");
      });
    }

    function gradeQuiz(event) {
      event.preventDefault();
      const answers = getAnswers();
      let correct = 0;
      const incorrect = [];

      questions.forEach((item, index) => {
        const userAnswer = answers[index];
        if (userAnswer === item.a) {
          correct++;
        } else {
          incorrect.push({
            number: index + 1,
            question: item.q,
            selected: userAnswer,
            correct: item.a,
            correctText: item.o[item.a],
            selectedText: userAnswer === null ? "Not answered" : item.o[userAnswer]
          });
        }
      });

      const score100 = ((correct / questions.length) * 100).toFixed(2);
      const gradeClass = score100 >= 80 ? "excellent" : score100 >= 60 ? "good" : "needs-work";

      resultPanel.className = `results ${gradeClass}`;
      resultPanel.innerHTML = `
        <div class="result-header">
          <div>
            <p class="eyebrow">Final Grade</p>
            <h2>${correct}/60</h2>
            <p class="big-score">${score100}/100</p>
          </div>
          <div class="result-badge">${incorrect.length === 0 ? "Perfect Score" : `${incorrect.length} incorrect`}</div>
        </div>

        <div class="summary-grid">
          <div><strong>${correct}</strong><span>Correct</span></div>
          <div><strong>${incorrect.length}</strong><span>Incorrect / Missing</span></div>
          <div><strong>${score100}%</strong><span>Percentage</span></div>
        </div>

        <h3>Incorrect Answers Review</h3>
        ${incorrect.length === 0 ? `<p class="perfect">Excellent work! You answered every question correctly.</p>` : `
          <div class="incorrect-list">
            ${incorrect.map(item => `
              <article class="incorrect-card">
                <h4>Question ${item.number}: ${item.question}</h4>
                <p><strong>Your answer:</strong> ${item.selected === null ? "Not answered" : `${letters[item.selected]}) ${item.selectedText}`}</p>
                <p><strong>Correct answer:</strong> ${letters[item.correct]}) ${item.correctText}</p>
              </article>
            `).join("")}
          </div>
        `}
      `;

      resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function resetQuiz() {
      quizForm.reset();
      resultPanel.className = "results hidden";
      resultPanel.innerHTML = "";
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderQuiz();
    quizForm.addEventListener("change", updateProgress);
    quizForm.addEventListener("submit", gradeQuiz);
    document.getElementById("submitBtn").addEventListener("click", () => quizForm.requestSubmit());
    document.getElementById("resetBtn").addEventListener("click", resetQuiz);
    updateProgress();
  </script>
